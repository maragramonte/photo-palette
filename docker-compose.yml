# Despliegue de la API en el VPS (tarea P02).
#
# Contenedor propio, separado del Dr. Agramonte: si alguien tira abajo este, el otro sigue
# en pie. Los límites no son decorativos, son lo que impide que un análisis grande se lleve
# por delante al vecino.
services:
  photo-palette:
    build: .
    image: photo-palette:1.0.0
    container_name: photo-palette
    restart: unless-stopped

    # Los dos límites del backlog (I03 comprueba que se respetan bajo carga).
    mem_limit: 512m
    cpus: 1.0

    # Solo escucha en el loopback del VPS: a internet se llega por Caddy, con HTTPS.
    # Si Caddy también va en Docker, borra este bloque, deja solo `expose` y mete los dos
    # contenedores en la misma red.
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "8080"

    environment:
      # La web publicada. Para probar desde otro sitio, añade orígenes separados por comas.
      PHOTOPALETTE_ORIGENES_PERMITIDOS: "https://maragramonte.github.io"
      PHOTOPALETTE_PETICIONES_POR_MINUTO: "10"
      PHOTOPALETTE_ANALISIS_SIMULTANEOS: "2"
      PHOTOPALETTE_SUBIDAS_SIMULTANEAS: "4"

    # El healthcheck lo define el Dockerfile, para que valga tambien con `docker run`
    # pelado. Aqui estaba repetido palabra por palabra: dos sitios que se desincronizan.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
