server:
  port: 8080
  tomcat:
    # Si la subida se pasa de tamano, Tomcat tiene que terminar de leer el cuerpo
    # para poder contestar un 413 por la misma conexion. Sin este margen corta la
    # conexion y el navegador muestra un error de red en vez del mensaje de la API.
    max-swallow-size: 15MB
    # El Semaphore de ServicioPaletas limita el k-means, no los bytes en el heap: el
    # controlador ya tiene el byte[] de la subida (hasta 10 MB) antes de pedir permiso.
    # Con los 200 hilos de serie el techo real serian 200 x 10 MB, no dos analisis.
    threads:
      max: 25
    max-connections: 100
  # Detras de Caddy, Tomcat lee X-Forwarded-For y X-Forwarded-Proto, pero solo cuando la
  # conexion viene de un proxy de la red interna (10.x, 172.16-31.x, 192.168.x, 127.x).
  # Sin esto, el límite por IP contaría todas las visitas como una sola.
  forward-headers-strategy: native
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: photo-palette
  servlet:
    multipart:
      # El tope duro de la subida: a partir de aquí, 413.
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails:
      enabled: true

photopalette:
  # La web publicada. En local se añade http://localhost:5173 con el perfil dev.
  origenes-permitidos: https://maragramonte.github.io
  peticiones-por-minuto: 10
  analisis-simultaneos: 2

logging:
  level:
    root: INFO
    com.maragramonte.photopalette: INFO

---
spring:
  config:
    activate:
      on-profile: dev
photopalette:
  origenes-permitidos: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000

---
# Perfil para Fly.io.
#
# Fly conecta con el contenedor desde su red privada, que es IPv6 y empieza por fdaa:.
# Esa familia no esta en la lista de proxies de confianza que Tomcat trae de serie, toda
# IPv4, asi que sin esta linea Tomcat ignoraria X-Forwarded-For y todas las visitas
# compartirian un unico cupo de peticiones por minuto. Es el tipo de fallo que no rompe
# nada y deja el limite por IP sin efecto, asi que hay un test que lo vigila.
#
# La lista es la de Tomcat por defecto (10/8, 192.168/16, 169.254/16, 127/8, 172.16-31/12
# y el loopback IPv6) mas el rango de Fly al final.
spring:
  config:
    activate:
      on-profile: fly
server:
  tomcat:
    remoteip:
      internal-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]\.\d{1,3}\.\d{1,3}|172\.2[0-9]\.\d{1,3}\.\d{1,3}|172\.3[0-1]\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|fdaa:.*'
