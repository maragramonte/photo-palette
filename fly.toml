# Despliegue de la API en Fly.io.
#
# Usa el mismo Dockerfile que el VPS: aquí no hay nada que no se pueda tirar y mover a
# `docker compose up -d` el día que levantes la máquina.
#
# Comandos y detalles: docs/DESPLIEGUE-FLY.md

app = "photo-palette"
primary_region = "mad"   # Madrid, el más cercano a Mallorca

[build]
  dockerfile = "Dockerfile"

[env]
  # El perfil fly solo añade una cosa: que Tomcat se fíe del proxy de Fly al leer la IP
  # real del visitante. Sin él, el límite por IP se vuelve un cupo único para todos.
  SPRING_PROFILES_ACTIVE = "fly"

  PHOTOPALETTE_ORIGENES_PERMITIDOS = "https://maragramonte.github.io"
  PHOTOPALETTE_PETICIONES_POR_MINUTO = "10"
  PHOTOPALETTE_ANALISIS_SIMULTANEOS = "2"

[http_service]
  internal_port = 8080
  force_https = true

  # Sin visitas, la máquina se suspende y deja de costar. "suspend" guarda la memoria tal
  # cual y vuelve en menos de un segundo; "stop" la apaga del todo y arrancar Spring Boot
  # otra vez son unos ocho. Si tu flyctl no acepta "suspend", cámbialo por "stop".
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # El cuello de botella real es el Semaphore(2) de la aplicación, que contesta 503 al
  # tercer análisis. Esto es solo la red de seguridad de delante.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

# Fly comprueba la salud por el mismo endpoint que la web, y queda fuera del límite por IP.
[[http_service.checks]]
  method = "GET"
  path = "/api/salud"
  interval = "30s"
  timeout = "5s"
  grace_period = "40s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"   # el mismo tope que mem_limit en docker-compose.yml
