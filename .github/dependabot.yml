# Pull requests de actualización, con el mismo criterio que en dr-agramonte.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # El salto a Spring Boot 4 es una migración (Jackson 3, Security 7) y se hará a mano.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Java 21 es el mismo JDK del CI y del pom: subir de mayor va junto a ellos. La imagen de
    # Maven lleva el JDK en la etiqueta (3.9-eclipse-temurin-21), así que Dependabot la
    # propondría con otro Java; se sube a mano.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
