# Los tests del backend en cada push (tarea P01). El badge del README mira a este workflow.
name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: mvn test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests
        run: mvn -B verify

      - name: Informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  imagen:
    name: docker build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      # Que la imagen se construya es parte del criterio de P01: un Dockerfile que solo
      # funciona en tu portátil no sirve de nada el día del despliegue.
      - name: Construir la imagen
        run: docker build -t photo-palette:ci .
