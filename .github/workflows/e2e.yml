# Las pruebas E2E de la web, con Playwright en un Chromium de escritorio y otro de móvil.
# La API se simula dentro del navegador (e2e/tests/api-simulada.js), así que no hace falta
# levantar el backend.
name: e2e

on:
  push:
    branches: [main]
    paths: ["web/**", "e2e/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["web/**", "e2e/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pasar las pruebas
        run: npx playwright test

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
